<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointage Pharmacie</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
    body { 
      background: #0f172a; 
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      min-height: 100vh; margin: 0; padding: 24px 16px; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .container { width: 100%; max-width: 440px; }
    
    .card {
      background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
      padding: 32px 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .badge-status {
      display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 16px;
    }
    .status-hors-service { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-en-service { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-en-pause { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .clock { font-size: 38px; font-weight: 800; color: #ffffff; letter-spacing: -1px; margin-bottom: 4px; }
    .date { font-size: 14px; color: #94a3b8; margin-bottom: 24px; font-weight: 600; }

    select, input {
      width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 16px; margin-bottom: 12px; border-radius: 12px; color: #ffffff; font-size: 15px; outline: none;
    }
    select:focus, input:focus { border-color: #6366f1; }

    .actions-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;
    }

    .btn {
      width: 100%; padding: 14px 12px; border-radius: 12px; border: none;
      font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: white; grid-column: span 2; }
    .btn-pause { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
    .btn-resume { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; }
    .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; grid-column: span 2; }

    .btn-toggle-inscription {
      background: transparent; color: #38bdf8; border: 1px dashed rgba(56, 189, 248, 0.4);
      margin-top: 20px; font-size: 13px; width: 100%; padding: 10px; border-radius: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-toggle-inscription:hover { background: rgba(56, 189, 248, 0.1); }

    .btn-register {
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; margin-top: 8px;
    }

    .inscription-box {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 20px; margin-top: 16px; text-align: left; display: none;
    }
    .inscription-box h3 { margin: 0 0 12px 0; font-size: 15px; color: #38bdf8; text-align: center; }

    .message { margin-top: 16px; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 8px; display: none; }
    .msg-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .msg-success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div id="badgeStatus" class="badge-status status-hors-service">● HORAILLES / HORS SERVICE</div>
      
      <div class="clock" id="liveClock">00:00:00</div>
      <div class="date" id="liveDate">Chargement...</div>

      <!-- SÉLECTION EMPLOYÉ & PIN -->
      <select id="employeSelect" onchange="rafraichirEtatBoutons()">
        <option value="">-- Sélectionnez votre nom --</option>
      </select>

      <input type="password" id="pinInput" placeholder="Code PIN (ex: 1234)" maxlength="4" inputmode="numeric">

      <!-- BOUTONS D'ACTION (START, PAUSE, REPRISE, STOP) -->
      <div class="actions-grid">
        <button id="btnStart" class="btn btn-start" onclick="enregistrerPointage('START')">▶ Prise de Service</button>
        <button id="btnPause" class="btn btn-pause" onclick="enregistrerPointage('PAUSE')">⏸ Pause</button>
        <button id="btnResume" class="btn btn-resume" onclick="enregistrerPointage('RESUME')">▶️ Reprise</button>
        <button id="btnStop" class="btn btn-stop" onclick="enregistrerPointage('STOP')">⏹ Fin de Service</button>
      </div>

      <div id="msgBox" class="message"></div>

      <!-- BOUTON INSCRIPTION -->
      <button class="btn-toggle-inscription" onclick="basculerFormulaireInscription()">➕ Nouvel employé ? S'inscrire ici</button>

      <!-- FORMULAIRE INSCRIPTION -->
      <div id="inscriptionBox" class="inscription-box">
        <h3>📝 Inscription Nouveau Personnel</h3>
        <input type="text" id="newNom" placeholder="Nom de famille">
        <input type="text" id="newPrenom" placeholder="Prénom">
        <input type="password" id="newPin" placeholder="Créer un code PIN (4 chiffres)" maxlength="4" inputmode="numeric">
        <button class="btn btn-register" onclick="inscrireEmploye()">Valider mon inscription ➔</button>
      </div>

    </div>
  </div>

  <script>
    const PHARMACIE_LAT = 5.3296667;
    const PHARMACIE_LNG = -4.0776944;
    const RAYON_MAX_METRES = 50;

    const API_ENDPOINT = "/.netlify/functions/pointage";
    let globalData = { employes: [], pointages: [] };

    function demarrerHorloge() {
      const maj = () => {
        const maintenant = new Date();
        document.getElementById('liveClock').textContent = maintenant.toLocaleTimeString('fr-FR');
        document.getElementById('liveDate').textContent = maintenant.toLocaleDateString('fr-FR', { 
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' 
        });
      };
      maj();
      setInterval(maj, 1000);
    }

    function calculerDistanceMetres(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    async function initialiser() {
      demarrerHorloge();
      await chargerDonnees();
    }

    async function chargerDonnees() {
      try {
        const res = await fetch(API_ENDPOINT);
        if (!res.ok) throw new Error("Impossible de charger les données.");
        globalData = await res.json();
        if (!globalData.employes) globalData.employes = [];
        if (!globalData.pointages) globalData.pointages = [];
        remplirSelectEmployes();
      } catch (err) {
        afficherMessage(`Erreur : ${err.message}`, true);
      }
    }

    function remplirSelectEmployes() {
      const select = document.getElementById('employeSelect');
      select.innerHTML = '<option value="">-- Sélectionnez votre nom --</option>';
      
      globalData.employes.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = `${e.prenom} ${e.nom}`;
        select.appendChild(opt);
      });
    }

    function basculerFormulaireInscription() {
      const box = document.getElementById('inscriptionBox');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    // INSCRIPTION (SANS MODIFIER pointage.js)
    async function inscrireEmploye() {
      const nom = document.getElementById('newNom').value.trim();
      const prenom = document.getElementById('newPrenom').value.trim();
      const pin = document.getElementById('newPin').value.trim();

      if (!nom || !prenom) return afficherMessage("Veuillez remplir le nom et le prénom.", true);
      if (pin.length !== 4 || isNaN(pin)) return afficherMessage("Le code PIN doit comporter 4 chiffres.", true);

      // Vérifier si le PIN est déjà pris
      const pinExiste = globalData.employes.some(e => e.pin === pin);
      if (pinExiste) return afficherMessage("Ce code PIN est déjà pris. Choisissez-en un autre.", true);

      afficherMessage("Inscription en cours...", false);

      // Calcul du nouvel ID
      const newId = globalData.employes.length > 0 
        ? Math.max(...globalData.employes.map(e => e.id)) + 1 
        : 1;

      // Ajout de l'employé dans les données locales
      globalData.employes.push({
        id: newId,
        nom: nom,
        prenom: prenom,
        pin: pin,
        heures_contrat: 160
      });

      // Envoi du fichier mis à jour à la fonction Netlify existante
      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Inscription de ${prenom} ${nom}`,
            data: globalData
          })
        });

        if (!res.ok) throw new Error("Erreur lors de l'enregistrement de l'inscription.");

        afficherMessage(`Bienvenue ${prenom} ! Inscription réussie.`, false);
        document.getElementById('newNom').value = '';
        document.getElementById('newPrenom').value = '';
        document.getElementById('newPin').value = '';
        document.getElementById('inscriptionBox').style.display = 'none';

        remplirSelectEmployes();

      } catch (err) {
        afficherMessage(`Erreur : ${err.message}`, true);
      }
    }

    function rafraichirEtatBoutons() {
      const empId = parseInt(document.getElementById('employeSelect').value);
      const badge = document.getElementById('badgeStatus');
      
      if (!empId) {
        badge.className = "badge-status status-hors-service";
        badge.textContent = "● SÉLECTIONNEZ UN EMPLOYÉ";
        return;
      }

      const pointagesEmp = globalData.pointages
        .filter(p => p.employe_id === empId)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      const dernierPointage = pointagesEmp.length > 0 ? pointagesEmp[pointagesEmp.length - 1] : null;
      const dernierAction = dernierPointage ? dernierPointage.action : 'STOP';

      if (dernierAction === 'START' || dernierAction === 'RESUME') {
        badge.className = "badge-status status-en-service";
        badge.textContent = "● EN SERVICE";
      } else if (dernierAction === 'PAUSE') {
        badge.className = "badge-status status-en-pause";
        badge.textContent = "⏸ EN PAUSE";
      } else {
        badge.className = "badge-status status-hors-service";
        badge.textContent = "● HORS SERVICE";
      }
    }

    // ENREGISTREMENT DE POINTAGE (SANS MODIFIER pointage.js)
    async function enregistrerPointage(action) {
      const empId = parseInt(document.getElementById('employeSelect').value);
      const pin = document.getElementById('pinInput').value.trim();

      if (!empId) return afficherMessage("Veuillez sélectionner votre nom.", true);
      
      // Vérification du PIN côté client
      const emp = globalData.employes.find(e => e.id === empId);
      if (!emp || emp.pin !== pin) {
        return afficherMessage("Code PIN incorrect.", true);
      }

      afficherMessage("Vérification GPS...", false);

      if (!navigator.geolocation) {
        return afficherMessage("La géolocalisation n'est pas disponible.", true);
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const dist = calculerDistanceMetres(
            PHARMACIE_LAT, PHARMACIE_LNG, 
            pos.coords.latitude, pos.coords.longitude
          );

          if (dist > RAYON_MAX_METRES) {
            return afficherMessage(`Refusé : vous êtes à ${Math.round(dist)}m (max : ${RAYON_MAX_METRES}m).`, true);
          }

          // Ajout du pointage dans les données locales
          globalData.pointages.push({
            id: Date.now(),
            employe_id: empId,
            action: action,
            timestamp: new Date().toISOString(),
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            mode: 'MANUEL'
          });

          try {
            afficherMessage("Enregistrement en cours...", false);
            const res = await fetch(API_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `Pointage ${action} par ${emp.prenom} ${emp.nom}`,
                data: globalData
              })
            });

            if (!res.ok) throw new Error("Erreur lors de l'enregistrement du pointage.");

            afficherMessage(`Succès ! Action (${action}) enregistrée.`, false);
            document.getElementById('pinInput').value = '';
            rafraichirEtatBoutons();

          } catch (err) {
            afficherMessage(`Erreur : ${err.message}`, true);
          }
        },
        () => afficherMessage("Veuillez autoriser le GPS pour pointer.", true),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function afficherMessage(txt, estErreur) {
      const box = document.getElementById('msgBox');
      box.style.display = 'block';
      box.className = `message ${estErreur ? 'msg-error' : 'msg-success'}`;
      box.textContent = txt;
    }

    window.onload = initialiser;
  </script>
</body>
</html>
