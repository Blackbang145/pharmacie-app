<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Direction - Pharmacie</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
    body { 
      background: #0b0f19; color: #f8fafc; margin: 0; padding: 32px 16px; min-height: 100vh;
      background-image: radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
    }
    .container { max-width: 950px; margin: auto; }
    
    .header { display: flex; justify-space-between; align-items: center; margin-bottom: 32px; }
    h1 { font-size: 26px; font-weight: 800; color: #ffffff; margin: 0; display: flex; align-items: center; gap: 12px; }
    
    .btn-refresh { 
      background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); 
      padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-refresh:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-1px); }

    .card { 
      background: rgba(17, 24, 39, 0.8); border-radius: 20px; padding: 24px; margin-bottom: 24px; 
      border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    .card h2 { font-size: 18px; font-weight: 700; color: #94a3b8; margin: 0 0 16px 0; text-transform: uppercase; letter-spacing: 0.5px; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px 16px; color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; color: #e2e8f0; }
    tr:last-child td { border-bottom: none; }

    .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
    .badge-present { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-absent { background: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
    .badge-auto { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

    .hours-count { font-size: 16px; font-weight: 800; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📊 Dashboard Direction</h1>
      <button class="btn-refresh" onclick="chargerDonnees()">🔄 Actualiser</button>
    </div>

    <div class="card">
      <h2>Présences en Direct</h2>
      <table>
        <thead>
          <tr>
            <th>Employé</th>
            <th>Statut</th>
            <th>Dernier Mouvement</th>
            <th>Mode Clôture</th>
          </tr>
        </thead>
        <tbody id="tablePresences">
          <tr><td colspan="4">Chargement des données...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Cumul des Heures Effectuées</h2>
      <table>
        <thead>
          <tr>
            <th>Employé</th>
            <th>Total Heures</th>
            <th>Objectif Mensuel</th>
          </tr>
        </thead>
        <tbody id="tableCumul">
          <tr><td colspan="3">Chargement des données...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const GITHUB_USER = "Blackbang145";
    const GITHUB_REPO = "pharmacie-app";
    const GITHUB_TOKEN = "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";

    const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`;

    function decodeUTF8(base64Str) {
      const cleanBase64 = base64Str.replace(/\n/g, '');
      const binaryString = atob(cleanBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) { bytes[i] = binaryString.charCodeAt(i); }
      return new TextDecoder().decode(bytes);
    }

    async function chargerDonnees() {
      try {
        const res = await fetch(API_URL, {
          headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
        });

        if (!res.ok) throw new Error("Erreur de connexion.");
        const fileData = await res.json();
        const data = JSON.parse(decodeUTF8(fileData.content));

        afficherPresences(data.employes || [], data.pointages || []);
        afficherHeures(data.employes || [], data.pointages || []);
      } catch (e) {
        alert("Erreur lors de la récupération des données.");
      }
    }

    function afficherPresences(employes, pointages) {
      const tbody = document.getElementById('tablePresences');
      tbody.innerHTML = '';

      if (employes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: #64748b;">Aucun employé dans le système.</td></tr>';
        return;
      }

      employes.forEach(emp => {
        const pEmp = pointages.filter(p => p.employe_id === emp.id).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        const dernier = pEmp[0];
        const estPresent = dernier && dernier.action === 'START';

        let row = `<tr>
          <td><b style="color: #ffffff;">${emp.prenom} ${emp.nom}</b></td>
          <td><span class="badge ${estPresent ? 'badge-present' : 'badge-absent'}">${estPresent ? '● PRÉSENT' : '○ ABSENT'}</span></td>
          <td>${dernier ? new Date(dernier.timestamp).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : 'Aucun mouvement'}</td>
          <td>${dernier && dernier.mode === 'AUTO_WIFI' ? '<span class="badge badge-auto">STOP AUTO (Wi-Fi)</span>' : (dernier ? dernier.mode : '-')}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function afficherHeures(employes, pointages) {
      const tbody = document.getElementById('tableCumul');
      tbody.innerHTML = '';

      if (employes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="color: #64748b;">Aucun employé enregistré.</td></tr>';
        return;
      }

      employes.forEach(emp => {
        const pEmp = pointages.filter(p => p.employe_id === emp.id).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
        let totalMs = 0; let startTemp = null;

        pEmp.forEach(p => {
          if (p.action === 'START') { startTemp = new Date(p.timestamp); } 
          else if (p.action === 'STOP' && startTemp) {
            totalMs += (new Date(p.timestamp) - startTemp);
            startTemp = null;
          }
        });

        const totalHeures = (totalMs / (1000 * 60 * 60)).toFixed(1);

        let row = `<tr>
          <td>${emp.prenom} ${emp.nom}</td>
          <td><span class="hours-count">${totalHeures} h</span></td>
          <td style="color: #94a3b8;">${emp.heures_contrat || 160} h / mois</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    chargerDonnees();
  </script>
</body>
</html>
